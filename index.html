<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seoul Safe Travel & K-Culture Map</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Kakao Map API with autoload=false fix -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e3ac476257c12cad9a42ce153a94bb41&libraries=services&autoload=false"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Ensure html and body fill viewport */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Explicit map size to guarantee Kakao Map renders */
        #map {
            width: 100% !important;
            height: 100% !important;
            min-height: 350px;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Custom Overlay Styling */
        .custom-overlay {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between z-20 shadow-sm shrink-0 gap-2">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-brand-600 to-indigo-500 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                <i class="fa-solid font-bold text-lg fa-compass"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    K-SafeMap <span class="text-xs px-2 py-0.5 bg-indigo-100 text-brand-700 font-medium rounded-full">Seoul Guide</span>
                </h1>
                <p class="text-xs text-slate-500 hidden sm:block">Dietary Safe Zones & Essential K-Culture Survival Tips</p>
            </div>
        </div>

        <!-- Mode Toggle Tabs -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="btn-mode-dietary" onclick="switchMode('dietary')" class="flex items-center space-x-2 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 bg-white text-emerald-700 shadow-sm">
                <i class="fa-solid fa-utensils text-emerald-600"></i>
                <span class="whitespace-nowrap">🕌🥗 Dietary Safe Zone</span>
            </button>
            <button id="btn-mode-culture" onclick="switchMode('culture')" class="flex items-center space-x-2 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-comments text-orange-500"></i>
                <span class="whitespace-nowrap">💬 K-Culture & Slang</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden h-full">

        <!-- Sidebar Container -->
        <aside id="sidebar" class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-lg transition-all duration-300 h-1/2 md:h-full shrink-0">
            
            <!-- Search & Filter Controls -->
            <div class="p-3 sm:p-4 border-b border-slate-100 space-y-3 bg-slate-50/50">
                <!-- Search Input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" onkeyup="filterPlaces()" placeholder="Search location, dish, phrase (e.g. Myeongdong)..." class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all shadow-sm">
                    <button onclick="clearSearch()" id="clear-search-btn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <!-- Sub-Filter Categories -->
                <div id="sub-filter-container" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                    <!-- Dynamic rendering via JS -->
                </div>
            </div>

            <!-- Place Counter Header -->
            <div class="px-4 py-2 bg-slate-100/60 border-b border-slate-100 flex items-center justify-between text-xs text-slate-500 font-medium">
                <span id="list-count">Showing 0 locations</span>
                <span id="active-mode-label" class="font-semibold text-emerald-600">Dietary Safe Mode</span>
            </div>

            <!-- Places List -->
            <div id="places-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2 space-y-1">
                <!-- Place cards inserted dynamically -->
            </div>
        </aside>

        <!-- Map View Container -->
        <main class="flex-1 relative h-1/2 md:h-full w-full bg-slate-100">
            <!-- Kakao Map Container -->
