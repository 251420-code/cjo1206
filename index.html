<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->

            </div>

            <!-- 모드 전환 탭 -->
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button id="btn-mode-all" onclick="setMode('all')" class="px-3 py-1.5 text-xs md:text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-slate-800 shadow-sm">
                    <i class="fa-solid fa-globe mr-1"></i> 전체보기

                <button id="btn-mode-dietary" onclick="setMode('dietary')" class="px-3 py-1.5 text-xs md:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-utensils text-emerald-600 mr-1"></i> 식이 안심 (Halal/Vegan)
                </button>
                <button id="btn-mode-culture" onclick="setMode('culture')" class="px-3 py-1.5 text-xs md:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-comments text-rose-500 mr-1"></i> K-문화 & 슬랭

            </div>

    </header>

    <!-- 메인 레이아웃 -->

        <!-- 좌측 사이드바 (리스트 & 검색) -->

            <!-- 검색 및 카테고리 필터 -->

                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" onkeyup="filterPlaces()" placeholder="장소명, 요리, K-슬랭 검색 (예: 이모님, 비건)" 
                        class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                </div>

                <!-- 세부 필터 태그 -->

            <!-- 스마트 비주얼 지도 (카카오맵 API 미작동 시 완벽 대체되는 인터랙티브 지도 화면) -->
            <div id="custom-visual-map" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center p-6 overflow-y-auto hidden">
                <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#34d399_1.5px,transparent_1.5px)] [background-size:24px_24px]"></div>
                
                <div class="w-full max-w-4xl z-10 space-y-4 my-auto">

                        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-semibold">

    <script>
        const placesData = [

            {

                address: "서울 용산구 보그모로 117",

                pronunciation: "Uyu-na gyeran-i deureo-gat-nayo?"
            },
            {
                id: 3,
                name: "오세계향 (인사동 비건 한식)",
                mode: "dietary",
                category: "vegan",
                lat: 37.5742,
                lng: 126.9848,
                address: "서울 종로구 인사동12길 14-5",
                badge: "🥬 채식 한식 전문점",
                tags: ["비건 불고기", "채수 찌개", "젓갈 안 들어간 김치"],
                desc: "한국 전통 음식을 동물성 재료 없이 안전하게 즐길 수 있는 비건 한식당입니다. 찌개육수로 사골 대신 채수를 사용합니다.",
                ingredientsNotes: "⚠️ 일반 한식당과 달리 김치에 멸치액젓/새우젓을 쓰지 않음\n✅ 콩고기 기반 뚝배기 불고기 제공",
                koreanPhrase: "고기 빼고 채수로 만들어 주세요.",
                pronunciation: "Gogi ppaego chaesu-ro mandeureo juseyo."
            },
            {
                id: 4,
                name: "마칸 할랄 한식당 (Makan Halal)",
                mode: "dietary",
                category: "halal",
                lat: 37.5325,
                lng: 126.9968,
                address: "서울 용산구 우사단로 52",
                badge: "🕌 KMF 할랄 인증 한식당",
                tags: ["할랄 삼계탕", "할랄 불고기", "무슬림 친화"],
                desc: "한국 이슬람교 중앙회(KMF) 인증을 받은 한식당으로, 할랄 인증 닭고기와 소고기로 만든 안심 삼계탕과 불고기를 맛볼 수 있습니다.",
                ingredientsNotes: "✅ KMF 공식 인증 마크 보유\n✅ 주류 판매 안 함",
                koreanPhrase: "할랄 인증서 보여주실 수 있나요?",
                pronunciation: "Halal injeongseo boyeojusil su it-nayo?"
            },
            {
                id: 5,
                name: "명동 교자 (식당 실전 문화)",
                mode: "culture",
                category: "tip",
                lat: 37.5625,
                lng: 126.9856,
                address: "서울 중구 명동10길 29",
                badge: "💡 한국 식당 실전 팁",
                tags: ["테이블 서랍 수저", "물은 셀프", "이모님 호출"],
                desc: "한국 식당에 처음 왔을 때 당황하기 쉬운 문화! 수저통은 테이블 옆 서랍에 있으며, 반찬 리필 시 부르는 호칭을 배웁니다.",
                ingredientsNotes: "💡 꿀팁: 벨이 없으면 손을 들고 '이모님~' 또는 '저기요~'라고 부르면 친절하게 응대해 주십니다.",
                koreanPhrase: "이모님, 김치 더 주세요!",
                pronunciation: "Imo-nim, kimchi deo juseyo!"
            },
            {
                id: 6,
                name: "홍대 버스킹 거리 (K-슬랭 체험)",
                mode: "culture",
                category: "slang",
                lat: 37.5552,
                lng: 126.9234,
                address: "서울 마포구 어울마당로 109",
                badge: "💬 MZ세대 K-슬랭 현장",
                tags: ["대박", "아아 (Ice Americano)", "내돈내산"],
                desc: "청춘의 거리 홍대에서 자주 쓰이는 유행어와 카페 주문 시 필수 줄임말인 '아아(아이스 아메리카노)'를 익힙니다.",
                ingredientsNotes: "☕ 카페 팁: '아아 한 잔 주세요' = 아이스 아메리카노 1잔 주문 완료!",
                koreanPhrase: "아아(아이스 아메리카노) 하나 주세요!",
                pronunciation: "A-A hana juseyo!"
            },
            {
                id: 7,
                name: "광장시장 (동선 & 깎아주세요 스팟)",
                mode: "culture",
                category: "slang",
                lat: 37.5701,
                lng: 126.9997,
                address: "서울 종로구 창경궁로 88",
                badge: "🛍️ 전통시장 애교 소통",
                tags: ["서비스 주세요", "좀 깎아주세요", "현금 할인"],
                desc: "전통시장에서 맛있는 음식을 먹거나 물건을 살 때 유용한 '서비스(무료 덤)' 요청 단어와 흥정 표현을 익힐 수 있는 곳입니다.",
                ingredientsNotes: "🥟 전통시장 팁: 음식을 많이 사면 웃으며 '서비스 많이 주세요~'라고 말해보세요!",
                koreanPhrase: "사장님, 서비스 조금만 주세요!",
                pronunciation: "Sajang-nim, service jogum-man juseyo!"
            }
        ];

        let map = null;
        let kakaoMarkers = [];
        let currentMode = 'all';
        let currentCategory = 'all';
        let isKakaoMapActive = false;

        window.onload = function() {
            initMap();
        };

        function initMap() {
            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(function() {
                    try {
                        const container = document.getElementById('map');
                        const options = {
                            center: new kakao.maps.LatLng(37.5550, 126.9800),
                            level: 6
                        };
                        map = new kakao.maps.Map(container, options);
                        
                        const zoomControl = new kakao.maps.ZoomControl();
                        map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

                        isKakaoMapActive = true;
                        document.getElementById('custom-visual-map').classList.add('hidden');
                        renderPlaces();
                    } catch (e) {
                        activateVisualMap();
                    }
                });
            } else {
                activateVisualMap();
            }
        }

        function activateVisualMap() {
            isKakaoMapActive = false;
            document.getElementById('custom-visual-map').classList.remove('hidden');
            renderVisualPins(getFilteredData());
            renderSidebarList(getFilteredData());
        }

        function getFilteredData() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

            return placesData.filter(place => {
                if (currentMode !== 'all' && place.mode !== currentMode) return false;
                if (currentCategory !== 'all' && place.category !== currentCategory) return false;

                if (searchTerm) {
                    const matchName = place.name.toLowerCase().includes(searchTerm);
                    const matchDesc = place.desc.toLowerCase().includes(searchTerm);
                    const matchTags = place.tags.some(t => t.toLowerCase().includes(searchTerm));
                    const matchPhrase = place.koreanPhrase.toLowerCase().includes(searchTerm);
                    return matchName || matchDesc || matchTags || matchPhrase;
                }
                return true;
            });
        }

        function setMode(mode) {
            currentMode = mode;
            ['all', 'dietary', 'culture'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 text-xs md:text-sm font-semibold rounded-lg transition-all duration-200 bg-slate-900 text-white shadow-sm";
                } else {
                    btn.className = "px-3 py-1.5 text-xs md:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900";
                }
            });
            renderPlaces();
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            const buttons = document.querySelectorAll('.cat-tag');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${category}'`)) {
                    btn.className = "cat-tag active px-2.5 py-1 rounded-lg border bg-slate-800 text-white border-slate-800 whitespace-nowrap font-medium transition-all";
                } else {
                    btn.className = "cat-tag px-2.5 py-1 rounded-lg border bg-white text-slate-600 border-slate-200 hover:bg-slate-100 whitespace-nowrap font-medium transition-all";
                }
            });
            renderPlaces();
        }

        function filterPlaces() {
            renderPlaces();
        }

        function renderPlaces() {
            const filtered = getFilteredData();
            renderSidebarList(filtered);

            if (isKakaoMapActive && map) {
                kakaoMarkers.forEach(m => m.setMap(null));
                kakaoMarkers = [];
                closeDetailPopup();

                const bounds = new kakao.maps.LatLngBounds();

                filtered.forEach(place => {
                    const loc = new kakao.maps.LatLng(place.lat, place.lng);
                    bounds.extend(loc);

                    const isDietary = place.mode === 'dietary';
                    const content = document.createElement('div');
                    content.className = "cursor-pointer transform hover:-translate-y-1 transition-transform";
                    content.innerHTML = `
                        <div class="flex items-center gap-1.5 bg-slate-900 text-white text-xs px-3 py-2 rounded-full shadow-xl border-2 ${isDietary ? 'border-emerald-400' : 'border-rose-400'}">
                            <i class="fa-solid ${isDietary ? 'fa-leaf text-emerald-400' : 'fa-comment text-rose-400'}"></i>
                            <span class="font-bold whitespace-nowrap">${place.name.split(' ')[0]}</span>
                        </div>
                    `;

                    content.onclick = function() {
                        showDetailPopup(place);
                    };

                    const customOverlay = new kakao.maps.CustomOverlay({
                        position: loc,
                        content: content,
                        yAnchor: 1
                    });

                    customOverlay.setMap(map);
                    kakaoMarkers.push(customOverlay);
                });

                if (filtered.length > 0) {
                    map.setBounds(bounds);
                }
            } else {
                renderVisualPins(filtered);
            }
        }

        function renderVisualPins(places) {
            const container = document.getElementById('visual-pins-container');
            container.innerHTML = '';

            if (places.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-8 text-xs">검색 결과가 없습니다.</div>`;
                return;
            }

            places.forEach(place => {
                const isDietary = place.mode === 'dietary';
                const card = document.createElement('div');
                card.className = "custom-pin bg-slate-800/90 border border-slate-700 p-3.5 rounded-2xl cursor-pointer hover:border-emerald-500 shadow-lg space-y-2 flex flex-col justify-between";
                card.onclick = () => showDetailPopup(place);

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isDietary ? 'bg-emerald-900 text-emerald-300' : 'bg-rose-900 text-rose-300'}">
                                ${place.badge}
                            </span>
                            <span class="text-[10px] text-slate-400"><i class="fa-solid fa-location-dot"></i> 서울</span>
                        </div>
                        <h4 class="font-bold text-sm text-white">${place.name}</h4>
                        <p class="text-xs text-slate-300 line-clamp-2">${place.desc}</p>
                    </div>
                    <div class="pt-2 flex items-center justify-between text-[11px] text-emerald-400 font-semibold border-t border-slate-700/60">
                        <span>상세 정보 보기</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showDetailPopup(place) {
            const popup = document.getElementById('detail-popup-card');
            popup.classList.remove('hidden');

            const isDietary = place.mode === 'dietary';
            popup.innerHTML = `
                <div class="${isDietary ? 'bg-emerald-600' : 'bg-rose-600'} text-white p-3.5 flex justify-between items-start">
                    <div>
                        <span class="text-[10px] bg-black/20 px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">${place.badge}</span>
                        <h3 class="font-bold text-base mt-1 leading-tight">${place.name}</h3>
                    </div>
                    <button onclick="closeDetailPopup()" class="text-white/80 hover:text-white p-1 text-sm">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 space-y-3 text-xs max-h-[60vh] overflow-y-auto">
                    <p class="text-slate-600 leading-relaxed">${place.desc}</p>
                    
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                        <span class="font-bold text-slate-700 block"><i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i> 주요 특징 및 팁:</span>
                        <p class="text-slate-600 whitespace-pre-line text-[11px]">${place.ingredientsNotes}</p>
                    </div>

                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-amber-900 text-[11px]">🗣️ 유용한 한글 표현:</span>
                            <button onclick="speakKorean('${place.koreanPhrase}')" class="text-xs bg-amber-200 hover:bg-amber-300 text-amber-900 px-2 py-0.5 rounded-md transition-all font-semibold">
                                <i class="fa-solid fa-volume-high mr-1"></i> 발음 듣기
                            </button>
                        </div>
                        <p class="font-bold text-sm text-slate-900 bg-white p-1.5 rounded border border-amber-100 flex justify-between items-center">
                            <span>"${place.koreanPhrase}"</span>
                            <button onclick="copyToClipboard('${place.koreanPhrase}')" title="복사" class="text-slate-400 hover:text-slate-600 text-xs">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </p>
                        <p class="text-[10px] text-slate-500 italic">발음: ${place.pronunciation}</p>
                    </div>

                    <div class="pt-1 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-100">
                        <span><i class="fa-solid fa-location-dot mr-1"></i>${place.address}</span>
                    </div>
                </div>
            `;
        }

        function closeDetailPopup() {
            document.getElementById('detail-popup-card').classList.add('hidden');
        }

        function renderSidebarList(places) {
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            if (places.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 space-y-2">
                        <i class="fa-solid fa-magnifying-glass text-3xl opacity-40"></i>
                        <p class="text-xs">조건에 맞는 장소가 없습니다.</p>
                    </div>
                `;
                return;
            }

            places.forEach(place => {
                const isDietary = place.mode === 'dietary';
                const card = document.createElement('div');
                card.className = "p-3.5 bg-white border border-slate-200 rounded-2xl hover:border-emerald-400 hover:shadow-md transition-all cursor-pointer space-y-2 group";
                
                card.onclick = function() {
                    showDetailPopup(place);
                };

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isDietary ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            ${place.badge}
                        </span>
                        <span class="text-[10px] text-slate-400"><i class="fa-solid fa-location-dot mr-0.5"></i> 서울</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm text-slate-800 group-hover:text-emerald-600 transition-colors">${place.name}</h4>
                        <p class="text-xs text-slate-500 line-clamp-2 mt-0.5">${place.desc}</p>
                    </div>
                    <div class="flex flex-wrap gap-1 pt-1">
                        ${place.tags.map(t => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">#${t}</span>`).join('')}
                    </div>
                `;

                listContainer.appendChild(card);
            });
        }

        function speakKorean(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("현재 브라우저는 음성 재생(TTS)을 지원하지 않습니다.");
            }
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const toast = document.createElement('div');
            toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-2xl z-50 flex items-center gap-2";
            toast.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 한글 표현이 클립보드에 복사되었습니다!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
